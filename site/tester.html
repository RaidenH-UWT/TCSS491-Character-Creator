<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <title>TCSS491 Character Creator</title>
        <link rel="icon" type="image/png" href="./icon.png"/> <!-- sets tab icon -->
        <link href="./style.css" rel="stylesheet" type="text/css" media="all"> <!-- stylesheet import -->
    </head>
    <body>
        <img id="testImage" src="./extensions/demo/resources/backgrounds/space.png">
        <canvas id="testCanvas" width="1024" height="768" style="margin: auto;"></canvas>
        <input id="colorPicker" type="color">
        <select id="blendMode">
            <option value="normal">Normal</option>
            <option value="multiply">Multiply</option>
            <option value="divide">Divide</option>
            <option value="addition">Addition</option>
            <option value="subtract">Subtract</option>
            <option value="inverseSubtract">Inverse Subtract</option>
            <option value="difference">Difference</option>
            <option value="darkenOnly">Darken Only</option>
            <option value="lightenOnly">Lighten Only</option>
            <option value="screen">Screen</option>
            <option value="overlay">Overlay</option>
            <option value="hardLight">Hard Light</option>
            <option value="softLight">Soft Light</option>
        </select>
        <script src="./scripts/colormath.js"></script>
        <script>
            const canvas = document.getElementById("testCanvas");
            const context = canvas.getContext("2d");
            const img = document.getElementById("testImage");
            const colorPicker = document.getElementById("colorPicker");
            const blendMode = document.getElementById("blendMode");
            let selectedColor = colorPicker.value;
            let selectedMode = blendMode.value;
            
            const update = (color, mode) => {
                let newImg = setColor(img, typeof color == 'undefined' ? selectedColor : color, typeof mode == 'undefined' ? selectedMode : mode);
                
                newImg.addEventListener("load", () => {
                    context.drawImage(newImg, 0, 0);
                });
            };
            
            img.addEventListener("load", () => {
                // CSS color uses 0-100 for S/L, but it's usually 0.0-1.0 (both are percentages) (H is 0-360)
                context.fillStyle = "white";
                context.fillRect(0, 0, 1024, 768);
                context.drawImage(img, 0, 0);
            });
            
            colorPicker.addEventListener("change", (event) => {
                selectedColor = event.target.value;
                update();
            });
            
            blendMode.addEventListener("change", (event) => {
                selectedMode = event.target.value;
                update();
            });
        </script>
    </body>
</html>
